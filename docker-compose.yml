# ══════════════════════════════════════════════════════════════════
#  GOLDENROUTE™ FW'26 — коллекция сокращена до необходимого.
#  wstunnel и nginx сняты с показа. Остался только Tor — и это осознанный выбор.
# ══════════════════════════════════════════════════════════════════

services:
  fw:
    build:
      context: ./fw
      dockerfile: Dockerfile
    network_mode: host                 # без посредников — иначе правила не работают
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    depends_on:
      - unbound
      - tor
    volumes:
      - ./fw/russian-ips.txt:/etc/goldenroute/russian-ips.txt
      - ./fw/tor-exclude-ips.txt:/etc/goldenroute/tor-exclude-ips.txt:ro
    environment:
      - TOR_SOCKS_PORT=${TOR_SOCKS_PORT:-9050}
      - TOR_REDSOCKS_PORT=${TOR_REDSOCKS_PORT:-12346}
      - LAN_CIDR=${LAN_CIDR:-192.168.1.0/24}

  unbound:
    build:
      context: ./unbound
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "$UNBOUND_PORT:53/tcp"
      - "$UNBOUND_PORT:53/udp"
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf
      - unbound_data:/var/lib/unbound

  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - $TOR_SOCKS_PORT:9050/tcp
      - ${TOR_CONTROL_PORT:-9051}:9051/tcp
    volumes:
      - ./tor/torrc:/etc/tor/torrc
      - ./tor/bridges.txt:/etc/tor/bridges.txt:ro
      - tor_data:/var/lib/tor

volumes:
  unbound_data:
    driver: local
  tor_data:
    driver: local
