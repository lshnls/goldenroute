# version: '3.8'

# LL_IPV4_ADDR="127.0.0.1"
# IP-адрес хоста с прокси (по умолчанию 127.0.0.1)
# если 0,0.0.0 то НЕОБХОДИМА установка параметра PAC_PROXY_HOST !
# LLP_SOCKS5_PROXY="31080"
# порт SOCKS5 (по умолчанию 31080)
# LLP_HTTP_PROXY="33128"
# порт HTTP-прокси (по умолчанию 33128)
# если 0,0,0,0 то необходимы
#

services:
  wstunnel:
    image: ghcr.io/erebe/wstunnel:latest
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      LL_IPV4_ADDR: "${LL_IPV4_ADDR:-127.0.0.1}"
      LLP_SOCKS5_PROXY: "${LLP_SOCKS5_PROXY:-41080}"
      LLP_HTTP_PROXY: "${LLP_HTTP_PROXY:-43128}"
    command: >
      /home/app/wstunnel client
      --local-to-remote socks5://0.0.0.0:1080
      --local-to-remote http://0.0.0.0:3128
      ws://nginx:80
    ports:
      - "${LL_IPV4_ADDR}:${LLP_SOCKS5_PROXY}:1080"
      - "${LL_IPV4_ADDR}:${LLP_HTTP_PROXY}:3128"
  fw:
    build:
      context: ./fw
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    depends_on:
      - unbound
      - nginx
      - wstunnel
      - tor
    volumes:
      - ./fw/entrypoint.sh:/entrypoint.sh:ro
      - ./fw/russian-ips.txt:/etc/goldenroute/russian-ips.txt
      - ./fw/russian-only-ips.txt:/etc/goldenroute/russian-only-ips.txt:ro
      - ./fw/tor-only-ips.txt:/etc/goldenroute/tor-only-ips.txt:ro
    environment:
#      - PROXY_BACKEND=${PROXY_BACKEND:-wstunnel} # obsolete
      - TOR_BALANCE=${TOR_BALANCE:-50}
      - WSTUNNEL_BALANCE=${WSTUNNEL_BALANCE:-50}
      - LLP_SOCKS5_PROXY=${LLP_SOCKS5_PROXY:-41080}
      - LLP_HTTP_PROXY=${LLP_HTTP_PROXY:-43128}
      - TOR_SOCKS_PORT=${TOR_SOCKS_PORT:-9050}
      - BLOCK_IPV6=${BLOCK_IPV6:-0}
  nginx:
    image: docker.io/nginx:alpine
    # container_name: nginx-pac
    restart: unless-stopped
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/backends.list:/etc/nginx/backends.list:ro
    entrypoint: |
      sh -c "
        cp /entrypoint.sh /tmp/ &&
        chmod +x /tmp/entrypoint.sh &&
        /tmp/entrypoint.sh 
        "
  unbound:
    build:
      context: ./unbound
      dockerfile: Dockerfile
    #container_name: unbound
    restart: unless-stopped
    ports:
      - "$UNBOUND_PORT:53/tcp"
      - "$UNBOUND_PORT:53/udp"
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf
      - unbound_data:/var/lib/unbound
    command: unbound -d -c /etc/unbound/unbound.conf
  
  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    #container_name: home_proxy-tor
    restart: unless-stopped
    ports:
      - $TOR_SOCKS_PORT:9050/tcp
      - ${TOR_CONTROL_PORT:-9051}:9051/tcp
    volumes:
      - ./tor/torrc:/etc/tor/torrc
      - ./tor/bridges.txt:/etc/tor/bridges.txt:ro
      - tor_data:/var/lib/tor

  iptables-exporter:
    build:
      context: ./monitoring/exporter
      dockerfile: Dockerfile
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    environment:
      - EXPORTER_LISTEN=0.0.0.0
      - EXPORTER_PORT=${EXPORTER_PORT:-9101}
      - EXPORTER_INTERVAL=${EXPORTER_INTERVAL:-5}

  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    network_mode: host
    restart: unless-stopped
    depends_on:
      - iptables-exporter
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-lifecycle

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    network_mode: host
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3000}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/goldenroute-connections.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  unbound_data:
    driver: local
  tor_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
